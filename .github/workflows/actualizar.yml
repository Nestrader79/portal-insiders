name: Actualizar datos

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás a revisar en la SEC (usa 7 la primera vez)"
        default: "3"
  schedule:
    - cron: "0 12 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar datos
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BARGO_API_KEY: ${{ secrets.BARGO_API_KEY }}
        run: python scripts/actualizar.py --dias "${{ github.event.inputs.dias || '3' }}"

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar portal
        id: publicar
        uses: actions/deploy-pages@v4
